name: check-workflow-status Test - Job Failure Detection

on:
  push:
    branches:
      - main
    paths:
      - 'check-workflow-status/**'
      - '.github/workflows/check-workflow-status-test-failure.yml'
  pull_request:
    paths:
      - 'check-workflow-status/**'
      - '.github/workflows/check-workflow-status-test-failure.yml'

permissions:
  contents: read
  actions: read

jobs:
  success-job:
    runs-on: kubernetes-runner
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Simulate successful job
        run: echo "This job succeeds"

  failing-job:
    name: This job is supposed to fail
    runs-on: kubernetes-runner
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Simulate failing job
        run: |
          echo "This job will fail"
          exit 1

  check-workflow-status:
    runs-on: kubernetes-runner
    if: always()
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Check workflow status (should fail)
        id: check-status
        uses: ./check-workflow-status
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Verify failure was detected
        uses: nick-fields/assert-action@22dd2a66ef733fe92022d3704183ac007463eecb # v3.0.0
        with:
          expected: failure
          actual: ${{ steps.check-status.outcome }}
