name: check-workflow-status Test - Skipped Jobs Disallowed

on:
  push:
    branches:
      - main
    paths:
      - 'check-workflow-status/**'
      - '.github/workflows/check-workflow-status-test-skipped-disallowed.yml'
  pull_request:
    paths:
      - 'check-workflow-status/**'
      - '.github/workflows/check-workflow-status-test-skipped-disallowed.yml'

permissions:
  contents: read
  actions: read

jobs:
  success-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Simulate successful job
        run: echo "This job succeeds"

  skipped-job:
    runs-on: ubuntu-latest
    name: This job is always skipped
    if: false
    steps:
      - name: This step never runs
        run: echo "This job is always skipped"

  check-workflow-status:
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check workflow status (skipped jobs disallowed)
        id: check-status
        uses: ./check-workflow-status
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          skipped-jobs-succeed: false
        continue-on-error: true

      - name: Verify failure was detected
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          expected: failure
          actual: ${{ steps.check-status.outcome }}
